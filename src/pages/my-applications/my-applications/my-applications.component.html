<div class="my-applications-container">

  <!-- Back Button -->
  <div class="action-back-container">
    <span class="back-text" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Go Back
    </span>
  </div>

  <h2 class="page-title">My Applications</h2>
  
  <div class="applications-list">

<div class="application-card" *ngFor="let app of applications">
  <div class="application-header">
    <h4>{{ app.title }}</h4>
    <span class="job-type-badge">{{ app.type }}</span>
  </div>
  
  <p class="company">{{ app.company }}</p>
  
  <div class="application-details">
    <p class="detail-item">
      <i class="fas fa-map-marker-alt"></i>
      <span>{{ app.location }}</span>
    </p>
    <p class="detail-item">
      <i class="fas fa-money-bill-wave"></i>
      <span>R{{ app.salary | number }} / month</span>
    </p>
    <p class="detail-item">
      <i class="fas fa-calendar"></i>
      <span>Applied {{ app.appliedAt | date:'mediumDate' }}</span>
    </p>
  </div>
</div>

  </div>


   <!-- Bottom Section -->
  <div class="applications-footer">
    <p class="footer-text">Looking for more opportunities?</p>
    <button class="browse-btn" (click)="browseJobs('/view-jobs')">Browse Jobs</button>
  </div>

   <!-- Footer -->
  <footer class="page-footer">
    <p>&copy; 2025 TalentBridge. All rights reserved.</p>
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Support</a>
      <a href="#">Contact</a>
    </div>
  </footer>

</div>
