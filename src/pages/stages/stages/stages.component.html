<app-loading-spinner></app-loading-spinner>
<div class="stages-container">

  <!-- Header -->
  <section class="page-header">
    <span class="back-text" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Back
    </span>
    <h2>Application Stages</h2>
    <p>Drag and drop candidates between different stages</p>
  </section>

  <!-- Stages Board -->
  <section class="stages-board">
    <div class="stage-column"
         *ngFor="let stage of stages; let i = index"
         cdkDropList
         [id]="'stage-' + i"
         [cdkDropListData]="stage.candidates"
         [cdkDropListConnectedTo]="stageIds"
         (cdkDropListDropped)="drop($event)">
      <h3>{{ stage.name }}</h3>

      <div class="candidate-card"
           *ngFor="let candidate of stage.candidates"
           cdkDrag>
        <h4>{{ candidate.name }}</h4>
        <p><strong>Email:</strong> {{ candidate.email }}</p>
        <p><strong>Applied for:</strong> {{ candidate.appliedFor }}</p>
      </div>
    </div>
  </section>

  <!-- Create Stage Button -->
<div class="create-stage-container" style="margin-top: 20px; display: flex; gap: 10px;">
  <button (click)="openModal()">+ Create Stage</button>
 <button (click)="proceed()">Proceed ></button>
</div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <h3>Enter Stage Name</h3>
      <input type="text" [(ngModel)]="newStageName" placeholder="Stage name" />
      <div class="modal-actions">
        <button (click)="saveStage()">Save</button>
        <button (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

</div>

<!-- Interview Modal -->
<div class="modal-backdrop" *ngIf="showInterviewModal">
  <div class="modal interview-modal">
    <h3>Schedule Interview</h3>
    <form [formGroup]="interviewForm">
      <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" formControlName="date" />
      </div>
      <div class="form-group">
        <label for="time">Time:</label>
        <input type="time" id="time" formControlName="time" />
      </div>
      <div class="form-group">
        <label for="type">Interview Type:</label>
        <select id="type" formControlName="type">
          <option value="VIRTUAL">Virtual</option>
          <option value="FACE_TO_FACE">Face to Face</option>
        </select>
      </div>
      <div class="form-group" *ngIf="interviewForm.get('type')?.value === 'VIRTUAL'">
        <label for="platform">Platform:</label>
        <select id="platform" formControlName="platform">
          <option value="GOOGLE_MEET">Google Meet</option>
          <option value="MS_TEAMS">MS Teams</option>
          <option value="ZOOM">Zoom</option>
        </select>
      </div>
      <div class="form-group" *ngIf="interviewForm.get('type')?.value === 'FACE_TO_FACE'">
        <label for="location">Location:</label>
        <input type="text" id="location" formControlName="location" />
      </div>
      <div class="modal-actions">
        <button (click)="scheduleInterview()">Schedule</button>
        <button (click)="closeInterviewModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>
